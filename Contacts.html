<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="start">
                
                
                

                <div class="logo">
                  <img class="h-logo" src="Gallary/logo.jpg" alt="logo" >
                </div>
                <div class="search-bar">
                    <input class="search-input" type="text" placeholder="  Search the bakery...">
                    <button class="search-button"><i class="fas fa-search"></i></button>
                </div>
                <div  class="menu-button">
                    <button id="dropdown-btn" class="nav-menu">&#9776;</button>
                    <div id="dropdown-menu" class="dropdown-content">
                        
                        <a href="index.html">Home</a>
                        <a href="Products.html">Products</a>
                        <a href="About.html">About</a>
                        
                        
                    </div>
                 </div>
                
                 
            


            </div>
        </header>
        <div class="contact-container">
            <h2>Contact Us</h2>
            <p>If you have any questions or inquiries, feel free to reach out to us using the contact form below:</p>
            <br>
            <p>We'll get back to you as soon as possible.</p>
            <br>
            
            <form class="contact-form">
                <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                </div>          
                <button id="submit-btn" class="submit-button" type="submit">Submit</button>
            </form>
        </div>
         <footer>
        <p>&copy; 2023 Yabo's Bakery. All rights reserved.</p>
    </footer>
    <script src="Function.js"></script>
</body>
</html>
